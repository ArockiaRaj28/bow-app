<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8edfb"/>
    </linearGradient>
  </defs>

  <!-- App-icon background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="7" y="7" width="498" height="498" rx="110" fill="none"
        stroke="rgba(255,255,255,0.18)" stroke-width="5"/>

  <!-- Wallet body -->
  <rect x="112" y="156" width="288" height="220" rx="42" fill="url(#body)"/>

  <!-- Flap seam -->
  <line x1="146" y1="222" x2="366" y2="222"
        stroke="#c3cdf3" stroke-width="11" stroke-linecap="round"/>

  <!-- Japan-sun coin with yen glyph (strokes, font-independent) -->
  <circle cx="342" cy="284" r="50" fill="#ef4444"/>
  <g stroke="#ffffff" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M324 260 L342 288"/>
    <path d="M360 260 L342 288"/>
    <path d="M342 288 L342 312"/>
    <path d="M326 300 L358 300"/>
  </g>

  <!-- Subtle card peeking from the top slot -->
  <rect x="150" y="170" width="132" height="26" rx="13" fill="#93b4fb"/>
</svg>
